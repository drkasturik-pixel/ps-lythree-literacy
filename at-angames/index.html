<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shadow Match Game</title>

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#fdf6e3;
    overflow:hidden;
}

#splash{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:white;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

#splash img{
    width:220px;
}

#game{
    display:none;
    height:100vh;
    padding:10px;
    box-sizing:border-box;
}

h1{
    text-align:center;
    color:#444;
    font-size:24px;
    margin:5px;
}

#startBtn{
    display:block;
    margin:10px auto;
    padding:10px 20px;
    border:none;
    border-radius:10px;
    background:#ffcc80;
    font-size:18px;
}

.container{
    display:flex;
    justify-content:space-between;
    height:78vh;
}

.column{
    width:48%;
    display:flex;
    flex-direction:column;
    justify-content:space-around;
}

.box{
    height:22%;
    background:white;
    border-radius:15px;
    border:3px solid #ffd180;
    display:flex;
    justify-content:center;
    align-items:center;
}

.box img{
    max-width:90%;
    max-height:90%;
}

.shadow.correct{
    border:4px solid green;
    background:#e8ffe8;
}

#feedback{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:90px;
    display:none;
}

@media(max-width:768px){

    h1{
        font-size:18px;
    }

    .box{
        height:23%;
    }
}

</style>
</head>

<body>

<!-- SPLASH -->

<div id="splash">
    <img src="assets/innovine-logo.png">
</div>

<!-- GAME -->

<div id="game">

    <h1>
        Drag and match the action with the correct shadow
    </h1>

    <button id="startBtn">
        Start Game
    </button>

    <div class="container">

        <!-- LEFT -->

        <div class="column">

            <div class="box">
                <img src="assets/singer1.png"
                     draggable="true"
                     id="singer1">
            </div>

            <div class="box">
                <img src="assets/skipping2.png"
                     draggable="true"
                     id="skipping2">
            </div>

            <div class="box">
                <img src="assets/jumping3.png"
                     draggable="true"
                     id="jumping3">
            </div>

            <div class="box">
                <img src="assets/boy4.png"
                     draggable="true"
                     id="boy4">
            </div>

        </div>

        <!-- RIGHT -->

        <div class="column">

            <div class="box shadow"
                 data-match="singer1">

                <img src="assets/shadow1.png">

            </div>

            <div class="box shadow"
                 data-match="skipping2">

                <img src="assets/shadow2.png">

            </div>

            <div class="box shadow"
                 data-match="jumping3">

                <img src="assets/shadow3.png">

            </div>

            <div class="box shadow"
                 data-match="boy4">

                <img src="assets/shadow4.png">

            </div>

        </div>

    </div>

</div>

<!-- FEEDBACK -->

<div id="feedback"></div>

<!-- AUDIO -->

<audio id="correctSound" src="assets/correct (1).mp3"></audio>

<audio id="wrongSound" src="assets/wrong.mp3"></audio>

<audio id="bgMusic" loop>
    <source src="assets/background-music.mp3">
</audio>

<audio id="voiceInstruction">
    <source src="assets/instruction.mp3">
</audio>

<script>

/* SPLASH */

setTimeout(function(){

    document.getElementById("splash").style.display="none";
    document.getElementById("game").style.display="block";

},5000);

/* START BUTTON */

document.getElementById("startBtn").onclick=function(){

    document.getElementById("bgMusic").play();

    document.getElementById("voiceInstruction").play();

}

/* DRAG */

let dragged=null;

const draggables=document.querySelectorAll('[draggable="true"]');

draggables.forEach(function(item){

    item.addEventListener("dragstart",function(){

        dragged=item;

    });

});

/* DROP */

const shadows=document.querySelectorAll(".shadow");

shadows.forEach(function(shadow){

    shadow.addEventListener("dragover",function(e){

        e.preventDefault();

    });

    shadow.addEventListener("drop",function(e){

        e.preventDefault();

        let correct=shadow.getAttribute("data-match");

        if(dragged.id===correct){

            shadow.classList.add("correct");

            shadow.innerHTML="<img src='"+dragged.src+"'>";

            dragged.style.visibility="hidden";

            correctAnswer();

        }

        else{

            wrongAnswer();

        }

    });

});

/* FEEDBACK */

function correctAnswer(){

    document.getElementById("correctSound").play();

    let fb=document.getElementById("feedback");

    fb.innerHTML="👏";

    fb.style.display="block";

    setTimeout(function(){

        fb.style.display="none";

    },1000);

}

function wrongAnswer(){

    document.getElementById("wrongSound").play();

    let fb=document.getElementById("feedback");

    fb.innerHTML="❌";

    fb.style.display="block";

    setTimeout(function(){

        fb.style.display="none";

    },1000);

}

</script>

</body>
</html>
